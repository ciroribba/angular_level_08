<h1 class="text-3xl font-bold font-montserrat">Todos los productos de <span class="text-accent">{{gender()}}</span></h1>
<h2 class="text-lg mb-5">Para todos los gustos</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 mt-2">
    @for (product of productsResource.value()?.products ?? [] ; track $index) {
        <product-card [product]="product" />
    }
    <!-- Empty-->
    @empty {
        <div class="col-span-full text-center">
            <h2 class="text-2xl font-bold font-montserrat">No hay productos</h2>
            <p class="text-gray-500">No hay productos disponibles</p>
        </div>
    }
</div>
