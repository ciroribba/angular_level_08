<div class="card bg-base-100 shadow-xl animate-fade-in">
    <figure>
      <img
        [src]="product().images | productImage"
        alt=[product().title] />
    </figure>
    <div class="card-body">
      <h2 class="card-title font-montserrat text-accent text-xl">{{product().title}}</h2>
      <p>{{product().description | slice:0:70}}...</p>
        <a 
        class="link link-accent"
        [routerLink]="['/product', product().slug]">
        Ver producto
    </a>
      </div>
</div>
